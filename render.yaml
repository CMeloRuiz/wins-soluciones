# Blueprint de Render para WINS Soluciones
#
# Declara SOLO el sitio publico: estatico, generado con Vite.
#
# El backend (wins-api) se crea aparte, a mano, como Web Service. No esta aqui
# a proposito: asi se despliega, se reinicia y se revisa por separado, sin que
# un cambio en el sitio arrastre a la API ni al reves. Los pasos y las
# variables que necesita estan en backend/README.md.
#
# Para usarlo: en Render -> New -> Blueprint, y apuntar al repositorio.
#
# Las variables marcadas "sync: false" NO viven en este archivo: Render las
# pide al aplicar el blueprint y las guarda cifradas. Nunca se commitean
# credenciales aqui.

services:
  - type: web
    name: wins-soluciones
    env: static
    # Render ejecuta el build desde la raiz del repo, por eso el "cd frontend"
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist

    # Enrutamiento SPA: React Router maneja las rutas del lado del cliente, asi
    # que cualquier peticion que no corresponda a un archivo estatico debe
    # devolver index.html. Sin esto, recargar /nosotros o /servicios/... da 404.
    # Va como respaldo del archivo frontend/public/_redirects.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Los assets de Vite llevan hash en el nombre, asi que se pueden cachear
      # de forma indefinida sin riesgo de servir una version vieja.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    envVars:
      # URL del backend. Vite la incrusta en el bundle durante el build, no se
      # lee en tiempo de ejecucion: al cambiarla hay que volver a desplegar el
      # sitio para que surta efecto.
      #
      # Si se deja vacia, el sitio sigue funcionando con el contenido que ya
      # lleva escrito; solo deja de reflejar lo editado en el panel.
      - key: VITE_API_URL
        sync: false
