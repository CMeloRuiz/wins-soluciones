# Blueprint de Render para WINS Soluciones
#
# Dos servicios:
#   - wins-soluciones : el sitio publico, estatico, generado con Vite
#   - wins-api        : el backend del panel administrativo, proceso Node
#
# Para usarlo: en Render -> New -> Blueprint, y apuntar al repositorio.
#
# Las variables marcadas "sync: false" NO viven en este archivo: Render las
# pide al aplicar el blueprint y las guarda cifradas. Nunca se commitean
# credenciales aqui.

services:
  - type: web
    name: wins-soluciones
    env: static
    # Render ejecuta el build desde la raiz del repo, por eso el "cd frontend"
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist

    # Enrutamiento SPA: React Router maneja las rutas del lado del cliente, asi
    # que cualquier peticion que no corresponda a un archivo estatico debe
    # devolver index.html. Sin esto, recargar /nosotros o /servicios/... da 404.
    # Va como respaldo del archivo frontend/public/_redirects.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Los assets de Vite llevan hash en el nombre, asi que se pueden cachear
      # de forma indefinida sin riesgo de servir una version vieja.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    envVars:
      # URL del backend. Vite la incrusta en el bundle durante el build, no se
      # lee en tiempo de ejecucion: al cambiarla hay que volver a desplegar el
      # sitio para que surta efecto.
      #
      # Si se deja vacia, el sitio sigue funcionando con el contenido que ya
      # lleva escrito; solo deja de reflejar lo editado en el panel.
      - key: VITE_API_URL
        sync: false

  # ===== Backend del panel administrativo =====
  - type: web
    name: wins-api
    env: node
    # Solo se instala y arranca lo de backend/, sin mezclar con el frontend
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    # Render reinicia el servicio si esta ruta deja de responder
    healthCheckPath: /api/salud

    envVars:
      # Render asigna el puerto por esta variable; el codigo ya la respeta.
      - key: PORT
        value: 10000

      # Origenes autorizados por CORS: la URL del sitio publicado, sin barra
      # final. Si no coincide, el panel no podra hablar con la API y el
      # servidor respondera 403 diciendo cual es el origen rechazado.
      - key: ORIGENES_PERMITIDOS
        sync: false

      # Cadena "Pooled connection" de Neon (el host lleva "-pooler").
      - key: DATABASE_URL
        sync: false

      # Se genera aqui mismo: Render crea un valor aleatorio y no hay que
      # inventarlo ni copiarlo a ningun sitio.
      - key: JWT_SECRETO
        generateValue: true

      - key: JWT_DURACION
        value: 8h

      - key: ADMIN_USUARIO
        sync: false

      # Hash bcrypt, nunca la clave. Se genera con "npm run hash".
      - key: ADMIN_CLAVE_HASH
        sync: false

      - key: MAX_IMAGEN_MB
        value: "4"
